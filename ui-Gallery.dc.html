<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  .ek-g-main { border: none; padding: 0; cursor: zoom-in; display: block; width: 100%; }
  .ek-g-th { border: 1.5px solid #ECE3D2; padding: 0; cursor: pointer; border-radius: 10px; transition: border-color .2s, transform .2s; }
  .ek-g-th:hover { border-color: #4C653D; transform: translateY(-2px); }
  .ek-g-fav { position: absolute; top: 14px; right: 14px; z-index: 3; display: flex; align-items: center; justify-content: center; width: 42px; height: 42px; padding: 0; border-radius: 50%; cursor: pointer; box-shadow: 0 3px 10px rgba(45,58,46,.14); transition: background .2s, border-color .2s, color .2s, transform .2s; }
  .ek-g-fav:hover { transform: scale(1.06); }
  .ek-g-fav-off { background: rgba(255,255,255,.94); border: 1px solid #ECE3D2; }
  .ek-g-fav-off:hover { border-color: #E4D9C2; background: #F6F1E7; }
  .ek-g-fav-on { background: #D8763B; border: 1px solid #D8763B; }
  .ek-g-fav-on:hover { background: #B23803; border-color: #B23803; }
  .ek-g-vid { pointer-events: auto; cursor: pointer; font-family: 'Work Sans',sans-serif; transition: border-color .2s, background .2s; }
  .ek-g-vid:hover { border-color: #D14405 !important; background: #FFFFFF !important; }
  .ek-g-nav { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid rgba(246,241,231,.5); background: rgba(34,48,31,.5); cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background .2s, border-color .2s; }
  .ek-g-nav:hover { background: #4C653D; border-color: #4C653D; }
  @media (max-width: 549px) { .ek-g-nav { width: 40px; height: 40px; } }
  .ek-g-row { display: grid; grid-template-columns: minmax(0,1fr); gap: 12px; align-items: start; }
  .ek-g-row.ek-g-has-th { grid-template-columns: 78px minmax(0,1fr); }
  .ek-g-ths { display: flex; flex-direction: column; gap: 10px; }
  /* G2: miniatury pod fotkou, zarovnané vlevo */
  .ek-g-row.ek-g-below { grid-template-columns: minmax(0,1fr) !important; }
  .ek-g-below .ek-g-ths { order: 2; flex-direction: row; flex-wrap: wrap; justify-content: flex-start; }
  .ek-g-track { display: none; }
  .ek-g-mnav { display: none; }
  .ek-g-arr { position: absolute; top: 50%; z-index: 2; transform: translateY(-50%); width: 40px; height: 40px; border-radius: 50%; border: 1px solid #ECE3D2; background: rgba(255,255,255,.94); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; box-shadow: 0 3px 10px rgba(45,58,46,.14); }
  .ek-g-arr:disabled { opacity: .35; cursor: default; }
  /* mobil: bez miniatur, listování velkou fotkou (swipe + šipky + tečky) */
  @media (max-width: 819px) {
    .ek-g-row.ek-g-has-th { grid-template-columns: minmax(0,1fr); }
    .ek-g-ths { display: none; }
    .ek-g-row.ek-g-multi .ek-g-main { display: none; }
    .ek-g-row.ek-g-multi .ek-g-track { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
    .ek-g-track::-webkit-scrollbar { display: none; }
    .ek-g-track > button { flex: 0 0 100%; scroll-snap-align: start; border: none; padding: 0; cursor: zoom-in; }
    .ek-g-row.ek-g-multi .ek-g-mnav { display: flex; }
  }

  /* Jednotný lightbox galerií (produkt, Organic Lab, Mirčina mýdla) */
  .ek-lbx { position: fixed; inset: 0; z-index: 400; display: flex; flex-direction: column; background: rgba(26,36,24,.96); color: #F6F1E7; font-family: 'Work Sans',sans-serif; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); box-sizing: border-box; }
  .ek-lbx-top { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 24px; }
  .ek-lbx-title { margin: 0; min-width: 0; font-family: 'EB Garamond',serif; font-weight: 500; font-size: 24px; line-height: 1.2; color: #F6F1E7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ek-lbx-close { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 44px; padding: 0 18px 0 14px; border-radius: 999px; border: 1.5px solid rgba(246,241,231,.4); background: rgba(246,241,231,.08); color: #F6F1E7; font-family: 'Work Sans',sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s, border-color .2s; }
  .ek-lbx-close:hover { background: rgba(246,241,231,.18); border-color: rgba(246,241,231,.6); }
  .ek-lbx-stage { flex: 1 1 auto; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .ek-lbx-stage::-webkit-scrollbar { display: none; }
  .ek-lbx-slide { flex: 0 0 100%; min-width: 100%; height: 100%; box-sizing: border-box; padding: 0 24px; scroll-snap-align: center; scroll-snap-stop: always; display: flex; align-items: center; justify-content: center; container-type: size; cursor: zoom-out; }
  .ek-lbx-img { display: block; max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 14px; cursor: default; user-select: none; -webkit-user-drag: none; }
  .ek-lbx-img.is-product { width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); max-width: none; max-height: none; background: #FFFFFF; }
  .ek-lbx-vid { display: block; width: min(100cqw, 177cqh); aspect-ratio: 16/9; max-height: 100%; border-radius: 14px; background: #1E261E; object-fit: contain; cursor: default; }
  .ek-lbx-bar { flex: 0 0 auto; display: flex; align-items: center; gap: 24px; padding: 16px 24px 22px; }
  .ek-lbx-thumbs { flex: 1 1 auto; min-width: 0; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
  .ek-lbx-thumbs::-webkit-scrollbar { display: none; }
  .ek-lbx-th { flex: 0 0 auto; position: relative; width: 64px; height: 64px; padding: 0; border-radius: 10px; border: 2px solid transparent; background: #1E261E center / cover no-repeat; opacity: .55; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: opacity .2s, border-color .2s; }
  .ek-lbx-th.is-product { background-color: #FFFFFF; background-size: contain; }
  .ek-lbx-th:hover { opacity: .85; }
  .ek-lbx-th.is-on { opacity: 1; border-color: #F6F1E7; }
  .ek-lbx-ctrl { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; margin-left: auto; }
  .ek-lbx-count { min-width: 56px; text-align: right; font-size: 15px; font-weight: 600; color: #D6E0C8; font-variant-numeric: tabular-nums; }
  .ek-lbx-nav { width: 52px; height: 52px; padding: 0; border-radius: 50%; border: 1.5px solid rgba(246,241,231,.5); background: rgba(246,241,231,.08); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: background .2s, border-color .2s; }
  .ek-lbx-nav:hover { background: #4C653D; border-color: #4C653D; }
  @media (max-width: 819px) {
    .ek-lbx-top { padding: 12px 16px; align-items: flex-start; }
    .ek-lbx-title { font-size: 20px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; padding-top: 8px; }
    .ek-lbx-close { width: 44px; padding: 0; }
    .ek-lbx-close-t { display: none; }
    .ek-lbx-slide { padding: 0 12px; }
    .ek-lbx-bar { flex-direction: column; align-items: stretch; gap: 12px; padding: 12px 16px 18px; }
    .ek-lbx-th { width: 54px; height: 54px; }
    .ek-lbx-ctrl { justify-content: flex-end; }
  }
</style>
</helmet>
<div style="display:flex; flex-direction:column; gap:14px; font-family:'Work Sans',sans-serif;">
  <div class="{{ rowCls }}">
  <sc-if value="{{ showThumbs }}" hint-placeholder-val="{{ false }}">
    <div class="ek-g-ths">
      <sc-for list="{{ thumbs }}" as="t" hint-placeholder-count="4">
        <button onClick="{{ t.select }}" class="ek-g-th" title="{{ t.alt }}" style="{{ t.style }}"><span style="{{ t.play }}"></span></button>
      </sc-for>
    </div>
  </sc-if>
  <div style="position:relative; min-width:0; border:1px solid #ECE3D2; border-radius:14px; overflow:hidden; background:#fff;">
    <button onClick="{{ openZoom }}" class="ek-g-main" title="Zvětšit fotografii" style="{{ mainStyle }}"></button>
    <div class="ek-g-track" ref="{{ trackRef }}">
      <sc-for list="{{ slides }}" as="s" hint-placeholder-count="3">
        <button onClick="{{ s.open }}" title="{{ s.alt }}" style="{{ s.style }}"></button>
      </sc-for>
    </div>
    <span class="ek-g-mnav" style="position:absolute; left:0; right:0; bottom:14px; z-index:2; justify-content:center; gap:6px; pointer-events:none;">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="3">
        <span style="{{ d.style }}"></span>
      </sc-for>
    </span>
    <span class="ek-g-mnav">
      <button onClick="{{ mPrev }}" disabled="{{ mAtStart }}" class="ek-g-arr" aria-label="Předchozí fotka" style="left:10px;"><span style="{{ iconPrevDark }}"></span></button>
      <button onClick="{{ mNext }}" disabled="{{ mAtEnd }}" class="ek-g-arr" aria-label="Další fotka" style="right:10px;"><span style="{{ iconNextDark }}"></span></button>
    </span>
    <button onClick="{{ toggleFav }}" class="{{ favClass }}" title="{{ favTitle }}" aria-pressed="{{ fav }}"><span style="{{ favIcon }}"></span></button>
    <span style="position:absolute; top:16px; left:16px; display:flex; flex-direction:column; align-items:flex-start; gap:8px; z-index:2; pointer-events:none;">
      <sc-for list="{{ badges }}" as="b" hint-placeholder-count="2">
        <dc-import name="ui-Badge" variant="{{ b.variant }}" label="{{ b.label }}" hint-size="100px,26px"></dc-import>
      </sc-for>
    </span>
    <span style="position:absolute; right:14px; bottom:14px; z-index:2; display:flex; align-items:center; gap:8px; pointer-events:none;">
      <sc-if value="{{ hasVideo }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ openVideo }}" class="ek-g-vid" title="Přehrát video k produktu" style="display:flex; align-items:center; gap:7px; box-sizing:border-box; height:40px; line-height:1; background:rgba(255,255,255,.94); border:1px solid #ECE3D2; border-radius:999px; padding:0 14px; font-size:12.5px; font-weight:600; color:#4C653D;"><span style="{{ iconVideo }}"></span>Video</button>
      </sc-if>
    </span>
  </div>

  </div>

  <p style="margin:0; font-size:13px; line-height:1.5; color:#6B6B5E; font-style:italic;">{{ note }}</p>

<sc-if value="{{ zoom }}" hint-placeholder-val="{{ false }}">
  <div class="ek-lbx" role="dialog" aria-modal="true" aria-label="{{ lbTitle }}">
    <div class="ek-lbx-top">
      <p class="ek-lbx-title">{{ lbTitle }}</p>
      <button type="button" class="ek-lbx-close" onClick="{{ lbClose }}" aria-label="Zavřít"><span style="{{ lbIcClose }}"></span><span class="ek-lbx-close-t">Zavřít</span></button>
    </div>
    <div class="ek-lbx-stage" ref="{{ lbTrackRef }}">
      <sc-for list="{{ lbSlides }}" as="s" hint-placeholder-count="3">
        <div class="ek-lbx-slide" onClick="{{ lbClose }}">
          <sc-if value="{{ s.isImg }}" hint-placeholder-val="{{ true }}">
            <img src="{{ s.src }}" alt="{{ s.alt }}" class="{{ s.cls }}" onClick="{{ lbStop }}" draggable="false">
          </sc-if>
          <sc-if value="{{ s.isVideo }}" hint-placeholder-val="{{ false }}">
            <video src="{{ s.src }}" poster="{{ s.poster }}" controls="{{ true }}" autoPlay="{{ true }}" playsInline="{{ true }}" class="ek-lbx-vid" onClick="{{ lbStop }}"></video>
          </sc-if>
        </div>
      </sc-for>
    </div>
    <div class="ek-lbx-bar">
      <sc-if value="{{ lbMulti }}" hint-placeholder-val="{{ true }}">
        <div class="ek-lbx-thumbs" ref="{{ lbThumbsRef }}">
          <sc-for list="{{ lbThumbs }}" as="t" hint-placeholder-count="4">
            <button type="button" class="{{ t.cls }}" onClick="{{ t.go }}" aria-label="{{ t.label }}" style="{{ t.style }}"><span style="{{ t.play }}"></span></button>
          </sc-for>
        </div>
        <div class="ek-lbx-ctrl">
          <span class="ek-lbx-count">{{ lbCounter }}</span>
          <button type="button" class="ek-lbx-nav" onClick="{{ lbPrev }}" aria-label="Předchozí"><span style="{{ lbIcPrev }}"></span></button>
          <button type="button" class="ek-lbx-nav" onClick="{{ lbNext }}" aria-label="Další"><span style="{{ lbIcNext }}"></span></button>
        </div>
      </sc-if>
    </div>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:680},&quot;layout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;side&quot;,&quot;below&quot;],&quot;default&quot;:&quot;side&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;productName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kyselina citronová&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;images&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{src:string, alt?:string}[]&quot;},&quot;video&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{src:string, poster?:string}&quot;},&quot;note&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Obrázek je pouze ilustrační.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;badges&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(string|{variant:string,label?:string})[]&quot;}}">
class Component extends DCLogic {
  state = { i: 0, zoom: false, fav: null, lb: 0, m: 0 };
  trackRef = (el) => {
    if (this._track === el) return;
    if (this._track && this._onScroll) this._track.removeEventListener('scroll', this._onScroll);
    this._track = el;
    if (!el) return;
    this._onScroll = () => { const m = Math.round(el.scrollLeft / Math.max(1, el.clientWidth)); if (m !== this.state.m) this.setState({ m }); };
    el.addEventListener('scroll', this._onScroll, { passive: true });
  };
  goSlide(m) { const el = this._track; if (el) el.scrollTo({ left: m * el.clientWidth, behavior: 'smooth' }); }

  favStore() {
    if (!window.__ekFav) window.__ekFav = new Set();
    return window.__ekFav;
  }

  mask(name, size, color) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = base + 'assets/icons/' + name + '.svg';
    return `display:inline-block; width:${size}px; height:${size}px; flex:0 0 auto; background-color:${color}; -webkit-mask:url("${url}") center / contain no-repeat; mask:url("${url}") center / contain no-repeat;`;
  }

  componentDidMount() {
    this.esc = (e) => {
      if (!this.state.zoom) return;
      if (e.key === 'Escape') this.setState({ zoom: false });
      if (e.key === 'ArrowRight') this.step(1);
      if (e.key === 'ArrowLeft') this.step(-1);
    };
    window.addEventListener('keydown', this.esc);
  }
  step(d) { this.lbGo((this.state.lb || 0) + d); }
  lbIndex() { return this.state.lb || 0; }
  lbSet(i) { this.setState({ lb: i }); }

  // --- jednotný lightbox: swipe přes scroll-snap, miniatury, navigace vpravo dole ---
  lbTrackRef = (el) => {
    if (this._lbT === el) return;
    if (this._lbT) {
      this._lbT.removeEventListener('scroll', this._lbOnScroll);
      window.removeEventListener('resize', this._lbOnResize);
    }
    this._lbT = el;
    if (!el) { document.documentElement.style.overflow = this._lbOv || ''; return; }
    this._lbOv = document.documentElement.style.overflow;
    document.documentElement.style.overflow = 'hidden';
    const align = () => { el.scrollLeft = this.lbIndex() * el.clientWidth; };
    align(); requestAnimationFrame(() => { align(); this.lbThumbInView(this.lbIndex(), false); });
    this._lbOnScroll = () => {
      clearTimeout(this._lbST);
      this._lbST = setTimeout(() => {
        const m = Math.round(el.scrollLeft / Math.max(1, el.clientWidth));
        if (m !== this.lbIndex()) { this.lbSet(m); this.lbThumbInView(m, true); }
      }, 90);
    };
    this._lbOnResize = () => align();
    el.addEventListener('scroll', this._lbOnScroll, { passive: true });
    window.addEventListener('resize', this._lbOnResize);
  };
  lbThumbsRef = (el) => { this._lbTh = el; };
  lbThumbInView(i, smooth) {
    const th = this._lbTh; if (!th) return;
    const b = th.querySelectorAll('.ek-lbx-th')[i]; if (!b) return;
    th.scrollTo({ left: b.offsetLeft - th.clientWidth / 2 + b.offsetWidth / 2, behavior: smooth ? 'smooth' : 'auto' });
  }
  lbGo(i) {
    const n = this._lbN || 1;
    const k = ((i % n) + n) % n;
    this.lbSet(k);
    const el = this._lbT;
    if (el) el.scrollTo({ left: k * el.clientWidth, behavior: Math.abs(k - Math.round(el.scrollLeft / Math.max(1, el.clientWidth))) > 1 ? 'auto' : 'smooth' });
    this.lbThumbInView(k, true);
  }
  lbIcon(name, size) {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const u = base + 'assets/icons/' + name + '.svg';
    return 'display:inline-block; flex:0 0 auto; width:' + size + 'px; height:' + size + 'px; background-color:#F6F1E7; -webkit-mask:url("' + u + '") center / contain no-repeat; mask:url("' + u + '") center / contain no-repeat;';
  }
  lbVals(items, title, product, close) {
    this._lbN = items.length;
    const i = Math.min(this.lbIndex(), items.length - 1);
    return {
      lbTitle: title,
      lbMulti: items.length > 1,
      lbCounter: (i + 1) + ' / ' + items.length,
      lbSlides: items.map((it, k) => ({
        isImg: it.type !== 'video' || k !== i,
        isVideo: it.type === 'video' && k === i,
        src: it.type === 'video' && k !== i ? (it.poster || '') : it.src,
        poster: it.poster || '',
        alt: it.alt || '',
        cls: 'ek-lbx-img' + (product ? ' is-product' : ''),
      })),
      lbThumbs: items.map((it, k) => ({
        cls: 'ek-lbx-th' + (product && it.type !== 'video' ? ' is-product' : '') + (k === i ? ' is-on' : ''),
        label: it.type === 'video' ? 'Přehrát video' : 'Zobrazit fotku ' + (k + 1),
        style: (it.type === 'video' ? (it.poster ? 'background-image:url("' + it.poster + '");' : 'background-color:#4C653D;') : 'background-image:url("' + it.src + '");'),
        play: it.type === 'video' ? this.lbIcon('play', 24) : 'display:none;',
        go: () => this.lbGo(k),
      })),
      lbClose: (e) => { if (e) e.stopPropagation(); close(); },
      lbStop: (e) => e.stopPropagation(),
      lbPrev: (e) => { if (e) e.stopPropagation(); this.lbGo(i - 1); },
      lbNext: (e) => { if (e) e.stopPropagation(); this.lbGo(i + 1); },
      lbTrackRef: this.lbTrackRef,
      lbThumbsRef: this.lbThumbsRef,
      lbIcClose: this.lbIcon('cancel-01', 22),
      lbIcPrev: this.lbIcon('arrow-left-01', 24),
      lbIcNext: this.lbIcon('arrow-right-01', 24),
    };
  }
  componentWillUnmount() { window.removeEventListener('keydown', this.esc); }

  renderVals() {
    const base = /\/components\//.test(location.pathname) ? '../' : '';
    const url = (src) => (/^(https?:|\/|\.\.|data:)/.test(src) ? src : base + src);
    const images = this.props.images ?? [
      { src: 'assets/products/kyselina-citronova-1-kg.webp', alt: 'Kyselina citronová 1 kg v papírovém sáčku' },
      { src: 'assets/products/mydlova-hmota-bambucke-maslo-1-kg.jpg', alt: 'Balení zblízka' },
      { src: 'assets/products/stabilizovany-vitamin-c-10-g.jpg', alt: 'Detail krystalů' },
    ];
    const i = Math.min(this.state.i, images.length - 1);
    const active = images[i] || images[0];

    // Položky lightboxu: všechny fotky, video (je-li) na konci
    const video = this.props.video ?? null;
    const lbItems = images.map((im, idx) => ({ type: 'img', src: im.src, idx }));
    if (video && video.src) lbItems.push({ type: 'video' });
    this._lbCount = lbItems.length;
    const lbi = Math.min(this.state.lb, lbItems.length - 1);
    const cur = lbItems[lbi] || lbItems[0];
    const zoomSrc = cur && cur.type === 'img' ? cur.src : active.src;
    const favId = this.props.productName ?? 'produkt';
    const favOn = this.state.fav !== null ? this.state.fav : this.favStore().has(favId);

    return {
      note: this.props.note ?? 'Obrázek je pouze ilustrační.',
      badges: (this.props.badges ?? []).map(b => (typeof b === 'string' ? { variant: b, label: '' } : { variant: b.variant, label: b.label ?? '' })),
      zoom: this.state.zoom,
      openZoom: () => this.setState({ zoom: true, lb: Math.max(0, lbItems.findIndex(x => x.type === 'img' && x.idx === i)) }),
      hasVideo: !!(video && video.src),
      openVideo: (e) => { if (e) { e.preventDefault(); e.stopPropagation(); } this.setState({ zoom: true, lb: lbItems.findIndex(x => x.type === 'video') }); },
      videoSrc: video ? url(video.src) : '',
      videoPoster: video && video.poster ? url(video.poster) : '',
      lbIsVideo: cur && cur.type === 'video',
      lbIsImage: !(cur && cur.type === 'video'),
      multi: lbItems.length > 1,
      lbCounter: lbItems.length > 1 ? (lbi + 1) + ' / ' + lbItems.length + (cur && cur.type === 'video' ? ' · video' : '') : '',
      lbPrev: (e) => { e.stopPropagation(); this.step(-1); },
      lbNext: (e) => { e.stopPropagation(); this.step(1); },
      stop: (e) => e.stopPropagation(),
      iconVideo: this.mask('play', 20, '#D14405'),
      iconPrev: this.mask('arrow-left-01', 24, '#F6F1E7'),
      iconNext: this.mask('arrow-right-01', 24, '#F6F1E7'),
      closeZoom: () => this.setState({ zoom: false }),
      mainStyle: 'aspect-ratio:1/1; background:#fff center/contain no-repeat; background-image:url("' + url(active.src) + '");',
      zoomStyle: 'width:min(820px,92vw,84vh); max-width:92vw; max-height:84vh; aspect-ratio:1/1; border-radius:16px; background:#fff center/contain no-repeat; background-image:url("' + url(zoomSrc) + '");',
      showThumbs: images.length > 1,
      rowCls: 'ek-g-row' + (images.length > 1 ? ' ek-g-has-th ek-g-multi' : '') + ((this.props.layout ?? 'side') === 'below' ? ' ek-g-below' : ''),
      slides: images.map((im, idx) => ({
        alt: im.alt || '',
        open: () => this.setState({ zoom: true, i: idx, lb: Math.max(0, lbItems.findIndex(x => x.type === 'img' && x.idx === idx)) }),
        style: 'aspect-ratio:1/1; background:#fff center/contain no-repeat; background-image:url("' + url(im.src) + '");',
      })),
      dots: images.map((im, idx) => ({ style: 'display:block; width:' + (idx === this.state.m ? 18 : 7) + 'px; height:7px; border-radius:999px; background:' + (idx === this.state.m ? '#4C653D' : 'rgba(76,101,61,.3)') + '; transition:width .2s;' })),
      mAtStart: this.state.m <= 0,
      mAtEnd: this.state.m >= images.length - 1,
      mPrev: (e) => { if (e) e.stopPropagation(); this.goSlide(Math.max(0, this.state.m - 1)); },
      mNext: (e) => { if (e) e.stopPropagation(); this.goSlide(Math.min(images.length - 1, this.state.m + 1)); },
      trackRef: this.trackRef,
      iconPrevDark: this.mask('arrow-left-01', 20, '#4C653D'),
      iconNextDark: this.mask('arrow-right-01', 20, '#4C653D'),
      thumbs: (() => {
        const hasVid = !!(video && video.src);
        const list = images.slice(0, hasVid ? 5 : 6).map((im, idx) => ({
        alt: im.alt || '',
        select: () => this.setState({ i: idx }),
        style: 'width:78px; height:78px; background:#fff center/contain no-repeat; background-image:url("' + url(im.src) + '");'
          + (idx === i ? ' border-color:#4C653D; box-shadow:0 0 0 2px rgba(76,101,61,.22);' : ''),
          play: 'display:none;',
        }));
        if (hasVid) list.push({
          alt: 'Video k produktu',
          select: () => this.setState({ zoom: true, lb: lbItems.findIndex(x => x.type === 'video') }),
          style: 'width:78px; height:78px; display:flex; align-items:center; justify-content:center; background:' + (video.poster ? '#22301F center/cover no-repeat url("' + url(video.poster) + '")' : '#F6F1E7') + ';',
          play: this.mask('play', 30, '#D14405'),
        });
        return list.slice(0, 6);
      })(),
      fav: favOn,
      favClass: 'ek-g-fav ' + (favOn ? 'ek-g-fav-on' : 'ek-g-fav-off'),
      favTitle: favOn ? 'Odebrat z oblíbených' : 'Přidat do oblíbených',
      favIcon: this.mask(favOn ? 'favourite-filled' : 'favourite', 21, favOn ? '#FFFFFF' : '#8a8776'),
      toggleFav: (e) => {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        const store = this.favStore();
        const next = !favOn;
        if (next) store.add(favId); else store.delete(favId);
        this.setState({ fav: next });
        window.dispatchEvent(new CustomEvent('ek-fav-change', { detail: { count: store.size } }));
      },
      iconZoom: this.mask('zoom-in-01', 20, '#4C653D'),
      iconClose: this.mask('cancel-01', 24, '#F6F1E7'),
      ...this.lbVals(lbItems.map(x => x.type === 'video'
        ? { type: 'video', src: url(video.src), poster: video.poster ? url(video.poster) : '' }
        : { type: 'img', src: url(x.src), alt: (images[x.idx] && images[x.idx].alt) || '' }),
        this.props.productName ?? 'Galerie produktu', true, () => this.setState({ zoom: false })),
    };
  }
}
</script>
</body>
</html>
